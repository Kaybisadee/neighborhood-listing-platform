.github/workflows/build.yml

name: Next.js Production Build

on:
  push:
    branches:
      - main
      - feature/neighborhood-website
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: neighborhood-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: neighborhood-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build
